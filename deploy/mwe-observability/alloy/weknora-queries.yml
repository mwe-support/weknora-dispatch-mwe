weknora_knowledge_status:
  query: |
    SELECT parse_status, COUNT(*)::bigint AS total
    FROM knowledges
    WHERE deleted_at IS NULL
    GROUP BY parse_status
  cache_seconds: 15
  metrics:
    - parse_status:
        usage: LABEL
        description: Current knowledge parse status
    - total:
        usage: GAUGE
        description: Current number of knowledge rows in this status

weknora_failed_knowledge_recent:
  query: |
    SELECT COUNT(*)::bigint AS total
    FROM knowledges
    WHERE parse_status = 'failed'
      AND updated_at > NOW() - INTERVAL '5 minutes'
  cache_seconds: 15
  metrics:
    - total:
        usage: GAUGE
        description: Knowledge rows entering failed state in the last five minutes

weknora_processing_stale:
  query: |
    SELECT parse_status, COUNT(*)::bigint AS total
    FROM knowledges
    WHERE parse_status IN ('pending', 'processing', 'finalizing')
      AND updated_at < NOW() - INTERVAL '70 minutes'
      AND deleted_at IS NULL
    GROUP BY parse_status
  cache_seconds: 15
  metrics:
    - parse_status:
        usage: LABEL
        description: Non-terminal parse status
    - total:
        usage: GAUGE
        description: Knowledge rows whose parent state has not changed for seventy minutes

weknora_dead_letters_recent:
  query: |
    SELECT task_type, COUNT(*)::bigint AS total
    FROM task_dead_letters
    WHERE failed_at > NOW() - INTERVAL '5 minutes'
    GROUP BY task_type
  cache_seconds: 15
  metrics:
    - task_type:
        usage: LABEL
        description: Archived task type
    - total:
        usage: GAUGE
        description: Dead letters created in the last five minutes

weknora_pending_ops:
  query: |
    SELECT task_type, COUNT(*)::bigint AS total,
           COALESCE(EXTRACT(EPOCH FROM NOW() - MIN(enqueued_at)), 0)::double precision AS oldest_seconds
    FROM task_pending_ops
    GROUP BY task_type
  cache_seconds: 15
  metrics:
    - task_type:
        usage: LABEL
        description: Durable pending-operation task type
    - total:
        usage: GAUGE
        description: Current durable pending-operation count
    - oldest_seconds:
        usage: GAUGE
        description: Age of the oldest durable pending operation

weknora_sync_status:
  query: |
    SELECT status, COUNT(*)::bigint AS total
    FROM sync_logs
    WHERE started_at > NOW() - INTERVAL '24 hours'
    GROUP BY status
  cache_seconds: 15
  metrics:
    - status:
        usage: LABEL
        description: Data-source sync status over the last twenty-four hours
    - total:
        usage: GAUGE
        description: Data-source sync runs over the last twenty-four hours

weknora_lifecycle_incidents:
  query: |
    SELECT error_code, COUNT(*)::bigint AS total
    FROM mwe_processing_unresolved_incidents GROUP BY error_code
  cache_seconds: 15
  metrics:
    - error_code:
        usage: LABEL
        description: Unresolved lifecycle incident code, including old cleanup
    - total:
        usage: GAUGE
        description: Unresolved incidents without an age cutoff

weknora_lifecycle_inconsistencies:
  query: |
    SELECT status, COUNT(*)::bigint AS total
    FROM mwe_processing_lifecycle_inconsistencies GROUP BY status
  cache_seconds: 15
  metrics:
    - status:
        usage: LABEL
        description: Lifecycle invariant that needs reconciliation
    - total:
        usage: GAUGE
        description: Current lifecycle inconsistencies

weknora_lifecycle_stages:
  query: |
    SELECT stage,status,COUNT(*)::bigint AS total
    FROM mwe_processing_stage_retry_queue GROUP BY stage,status
  cache_seconds: 15
  metrics:
    - stage:
        usage: LABEL
        description: Processing stage
    - status:
        usage: LABEL
        description: Authoritative stage state
    - total:
        usage: GAUGE
        description: Active or unresolved stage count
